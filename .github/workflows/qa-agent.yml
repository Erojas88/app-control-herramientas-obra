name: QA Agent

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  stress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stress test
        run: npm run qa:stress

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm run qa:security

      - name: Secret scan (basic)
        run: |
          if grep -RInE "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|EXPO_PUBLIC_FIREBASE_API_KEY=)|(private_key|client_email)" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Se detectaron secretos o claves potenciales en el repositorio." >&2
            exit 1
          fi
          echo "Sin secretos evidentes en archivos fuente."
